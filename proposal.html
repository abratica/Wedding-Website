<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Proposal — Rachel &amp; Andrew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #ede4d3;
    --cream-soft: #f5efe6;
    --cream-light: #faf6ee;
    --terra: #b06b3c;
    --terra-deep: #8a4f2a;
    --terra-soft: #d4926a;
    --ink: #3a2e22;
    --ink-mid: #6b5a4a;
    --ink-light: #8a7a68;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 300;
    font-size: 18px;
    line-height: 1.65;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ============ TOP NAV ============ */
  .site-nav {
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 22px 24px 0;
  }
  .nav-link {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--terra);
    text-decoration: none;
    transition: color 0.25s ease;
  }
  .nav-link:hover { color: var(--terra-deep); }
  @media (max-width: 480px) {
    .site-nav { gap: 18px; padding: 18px 12px 0; }
    .nav-link { font-size: 9px; letter-spacing: 0.25em; }
  }

  /* ============ PAGE HEADER ============ */
  main {
    flex: 1;
    padding: 30px 24px 80px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  .preword {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--terra);
    text-align: center;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.4rem, 6.5vw, 4rem);
    color: var(--ink);
    text-align: center;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .subtitle {
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    color: var(--ink-mid);
    font-size: clamp(1.05rem, 2vw, 1.25rem);
    margin-top: 12px;
  }
  .subtitle .star {
    color: var(--terra);
    margin: 0 0.4em;
  }

  .accent-line {
    width: 56px;
    height: 1px;
    background: var(--terra);
    margin: 36px auto;
  }

  /* ============ VIDEO SECTIONS ============ */
  .video-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    gap: 32px;
    max-width: 1000px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    .video-grid {
      grid-template-columns: 1fr;
      gap: 0;
      max-width: 460px;
    }
  }

  .video-section {
    margin: 0 auto;
    padding: 20px 0 40px;
    width: 100%;
  }

  .section-num {
    text-align: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    color: var(--terra);
    font-size: 1rem;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }
  .section-title {
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.5rem, 4vw, 2rem);
    color: var(--ink);
    margin-bottom: 28px;
    letter-spacing: -0.01em;
  }

  .video-wrap {
    position: relative;
    margin: 0 auto;
    max-width: 420px;
    background: transparent;
    /* Fallback aspect ratio (overridden by JS once Vimeo reports actual dims) */
    aspect-ratio: 9 / 16;
  }
  .video-wrap iframe {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    box-shadow: 0 30px 80px rgba(58, 46, 34, 0.18);
  }

  .caption {
    margin: 28px auto 0;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    color: var(--ink-mid);
    font-size: 1.05rem;
    max-width: 520px;
    line-height: 1.75;
  }
  .caption-attr {
    margin-top: 14px;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-light);
  }

  /* Divider between the two sections — vertical on desktop, horizontal on mobile */
  .section-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--terra-soft);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 0.9rem;
  }
  /* Desktop: vertical orientation */
  @media (min-width: 861px) {
    .section-divider {
      flex-direction: column;
      gap: 14px;
      align-self: stretch;
      padding: 80px 0;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    .section-divider::before,
    .section-divider::after {
      content: '';
      width: 1px;
      flex: 1;
      background: var(--terra-soft);
    }
  }
  /* Mobile: horizontal orientation */
  @media (max-width: 860px) {
    .section-divider {
      gap: 14px;
      margin: 40px auto 24px;
    }
    .section-divider::before,
    .section-divider::after {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--terra-soft);
    }
  }

  /* ============ FOOTER ============ */
  footer {
    padding: 50px 24px 40px;
    text-align: center;
    background: var(--cream-soft);
    border-top: 1px solid var(--terra-soft);
  }
  .footer-monogram {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.5rem;
    color: var(--terra);
    margin-bottom: 10px;
  }
  .footer-line {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    letter-spacing: 0.4em;
    color: var(--ink-light);
    text-transform: uppercase;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 640px) {
    .nav { padding: 18px 20px; }
    main { padding: 20px 18px 60px; }
    .accent-line { margin: 28px auto; }
    .section-divider { margin: 40px auto 24px; }
    .section-divider::before,
    .section-divider::after { width: 40px; }
  }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-link" href="/">Home</a>
  <a class="nav-link" href="/gallery.html">Gallery</a>
  <a class="nav-link" href="/#gifts">Registry</a>
</nav>

<main>
  <h1>the proposal</h1>
  <div class="subtitle">in two parts</div>

  <div class="accent-line"></div>

  <div class="video-grid">
    <!-- SECTION I — THE SETUP -->
    <section class="video-section">
      <h2 class="section-title">the escort</h2>

      <div class="video-wrap vimeo-video" data-video-id="1195436252">
        <iframe
          src="https://player.vimeo.com/video/1195436252?badge=0&amp;autopause=0&amp;dnt=1&amp;player_id=0&amp;app_id=58479"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          title="Sandoval Cameo">
        </iframe>
      </div>

      <div class="caption-attr">cameo by tom sandoval</div>
    </section>

    <div class="section-divider">and then</div>

    <!-- SECTION II — THE PROPOSAL -->
    <section class="video-section">
      <h2 class="section-title">the proposal</h2>

      <div class="video-wrap vimeo-video" data-video-id="1196097034">
        <iframe
          src="https://player.vimeo.com/video/1196097034?badge=0&amp;autopause=0&amp;dnt=1&amp;player_id=0&amp;app_id=58479"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          title="The Proposal">
        </iframe>
      </div>
    </section>
  </div>
</main>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
  // Auto-size every Vimeo video wrapper to match its actual aspect ratio,
  // so there's no letterboxing whether the video is landscape or portrait.
  // Also silently resets the player on 'ended' to suppress Vimeo's
  // free-tier "related videos" overlay.
  (function () {
    if (typeof Vimeo === 'undefined') return;
    var wraps = document.querySelectorAll('.vimeo-video');
    wraps.forEach(function (wrap) {
      var iframe = wrap.querySelector('iframe');
      if (!iframe) return;
      var player = new Vimeo.Player(iframe);
      Promise.all([player.getVideoWidth(), player.getVideoHeight()])
        .then(function (dims) {
          var w = dims[0], h = dims[1];
          if (w && h) {
            wrap.style.aspectRatio = w + ' / ' + h;
          }
        })
        .catch(function () { /* fallback ratio remains */ });
      player.on('ended', function () {
        player.setCurrentTime(0).then(function () { player.pause(); });
      });
    });
  })();
</script>

<footer>
  <div class="footer-monogram">R &amp; A</div>
  <div class="footer-line">5 · 12 · 2026 &nbsp;·&nbsp; Las Vegas</div>
</footer>

</body>
</html>
